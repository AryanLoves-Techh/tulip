x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT: ${RATE_LIMIT:-100}
  # 1h window => refill is negligible during a short burst, so the global total is exactly RATE_LIMIT
  RATE_WINDOW: ${RATE_WINDOW:-1h}
  RATE_STORE: ${RATE_STORE:-redis}
  REDIS_URL: redis://redis:6379
  FAIL_MODE: ${FAIL_MODE:-fail-open}

x-api: &api
  image: ratelimit-guard-api
  build:
    context: .
    dockerfile: apps/demo-api/Dockerfile
  init: true
  stop_grace_period: 3s
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api-1:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: node-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: node-2

  api-3:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: node-3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api-1, api-2, api-3]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus